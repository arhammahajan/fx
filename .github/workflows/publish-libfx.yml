name: Publish libfx

on:
  workflow_run:
    workflows: [CI, Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: npm channel to publish
        required: true
        type: choice
        options:
          - dev
          - stable

permissions:
  contents: read

concurrency:
  group: publish-libfx-${{ (github.event.workflow_run.name == 'Release' || inputs.channel == 'stable') && 'stable' || 'dev' }}
  cancel-in-progress: false

jobs:
  metadata:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.metadata.outputs.channel }}
      npm_tag: ${{ steps.metadata.outputs.npm_tag }}
      sha: ${{ steps.metadata.outputs.sha }}
      should_publish: ${{ steps.metadata.outputs.should_publish }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.workflow_run.head_sha }}

      - name: Resolve channel and version
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CHANNEL="$REQUESTED_CHANNEL"
            SHA=$(git rev-parse HEAD)
          else
            SHA="$WORKFLOW_SHA"
            if [ "$WORKFLOW_NAME" = "Release" ]; then
              CHANNEL=stable
            else
              CHANNEL=dev
            fi
          fi

          BASE_VERSION=$(grep 'pub const version' src/main.zig | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if ! [[ "$BASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::src/main.zig version is not strict SemVer"
            exit 1
          fi
          SHOULD_PUBLISH=true
          if [ "$CHANNEL" = "stable" ]; then
            TAG="v${BASE_VERSION}"
            if git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null; then
              TAG_SHA=$(git rev-list -n 1 "$TAG")
              if [ "$TAG_SHA" != "$SHA" ]; then
                if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                  echo "::error::Stable tag ${TAG} points to ${TAG_SHA}, not ${SHA}"
                  exit 1
                fi
                echo "Release workflow did not publish ${SHA}; skipping libfx stable publish"
                SHOULD_PUBLISH=false
              fi
            else
              if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                echo "::error::Stable tag ${TAG} does not exist"
                exit 1
              fi
              echo "Release workflow did not create ${TAG}; skipping libfx stable publish"
              SHOULD_PUBLISH=false
            fi
            VERSION="$BASE_VERSION"
            NPM_TAG=latest
          else
            SHORT_SHA=$(printf '%s' "$SHA" | cut -c1-12)
            VERSION="${BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}.g${SHORT_SHA}"
            NPM_TAG=dev
          fi

          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "npm_tag=${NPM_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "should_publish=${SHOULD_PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing libfx@${VERSION} on the ${CHANNEL} channel (${NPM_TAG})"

  native:
    needs: metadata
    if: needs.metadata.outputs.should_publish == 'true'
    name: Native (${{ matrix.package_platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            package_platform: linux-x64
            target_flags: -Dtarget=x86_64-linux-gnu.2.34 -Dcpu=baseline
            runtime_image: public.ecr.aws/lambda/nodejs@sha256:2472f0273d8848d8b2aa6528f5526b8a514b70703596199efe5a4b84d3d59b0b
          - runner: ubuntu-24.04-arm
            package_platform: linux-arm64
            target_flags: -Dtarget=aarch64-linux-gnu.2.34 -Dcpu=baseline
            runtime_image: public.ecr.aws/lambda/nodejs@sha256:104527dd19c1907b4aaf328b5b3af1ac0c5db6bb9c76be8cb73fb295ec58b0fe
          - runner: macos-15-intel
            package_platform: darwin-x64
          - runner: macos-15
            package_platform: darwin-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.17.0"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Build ReleaseSafe addon
        run: zig build libfx-napi -Dnapi-surface=core -Doptimize=ReleaseSafe -Dupdate-channel=${{ needs.metadata.outputs.channel }} ${{ matrix.target_flags }}

      - name: Check Linux ABI baseline
        if: startsWith(matrix.package_platform, 'linux-')
        run: |
          python3 sdk/tests/test-linux-abi.py
          python3 sdk/scripts/check-linux-abi.py zig-out/lib/libfx.node

      - name: Test Linux addon on Amazon Linux 2023
        if: startsWith(matrix.package_platform, 'linux-')
        run: |
          docker run --rm --network none --entrypoint /bin/bash \
            --volume "$PWD:/workspace:ro" --workdir /workspace \
            '${{ matrix.runtime_image }}' -euc '
              node -e '\''const assert = require("node:assert/strict"); assert.equal(process.report.getReport().header.glibcVersionRuntime, "2.34");'\''
              node sdk/tests/test-native-core-ready.mjs
              node sdk/tests/test-host-tools.mjs native
              node sdk/tests/test-host-tool-cancel.mjs native
            '

      - name: Test native addon
        run: npm run --prefix sdk test:node-napi

      - name: Name native addon for package discovery
        shell: bash
        run: |
          mkdir -p native-addons
          cp zig-out/lib/libfx.node native-addons/libfx.${{ matrix.package_platform }}.node

      - name: Upload native addon
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libfx-native-${{ matrix.package_platform }}
          path: native-addons/libfx.${{ matrix.package_platform }}.node
          if-no-files-found: error

  wasm:
    needs: metadata
    if: needs.metadata.outputs.should_publish == 'true'
    name: WebAssembly (ReleaseSmall)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.17.0"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Build ReleaseSmall WebAssembly surfaces
        run: |
          zig build -Dwasm-surface=core -Doptimize=ReleaseSmall -Dupdate-channel=${{ needs.metadata.outputs.channel }}
          zig build -Dwasm-surface=term -Doptimize=ReleaseSmall -Dupdate-channel=${{ needs.metadata.outputs.channel }}

      - name: Install terminal test dependencies
        run: npm ci --prefix sdk/node

      - name: Test Node and WebAssembly
        run: npm run --prefix sdk test:node-wasm

      - name: Upload WebAssembly artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libfx-wasm
          path: |
            zig-out/bin/fx-core.wasm
            zig-out/bin/fx-term.wasm
          if-no-files-found: error

  # libfx ships as six packages at one version: libfx, one @libfx/<platform>
  # per native addon (PKG-2), which libfx names as optional dependencies, and
  # @libfx/term with the terminal (PKG-3). See sdk/scripts/package-libfx.mjs.
  package:
    needs: [metadata, native, wasm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: libfx-native-*
          path: native-addons
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: libfx-wasm
          path: wasm-artifacts

      - name: Install the durable Worlds
        run: npm ci --prefix sdk/durable

      - name: Assemble packages
        env:
          LIBFX_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p zig-out/bin
          cp wasm-artifacts/*.wasm zig-out/bin/
          jq -e '
            .name == "libfx" and
            .type == "module" and
            .scripts != null and
            (.scripts | keys | all(startswith("test:"))) and
            (.dependencies == null) and
            (.devDependencies == null) and
            ((.optionalDependencies | keys) == ["@libfx/darwin-arm64", "@libfx/darwin-x64", "@libfx/linux-arm64", "@libfx/linux-x64"]) and
            (.peerDependencies == null) and
            (.bin == null)
          ' sdk/package.json >/dev/null

          LIBFX_REQUIRE_DOCS=1 node sdk/scripts/package-libfx.mjs sdk/dist native-addons/*.node
          # Every package has the release's version, and libfx's addons and
          # @libfx/term's libfx are pinned to it.
          jq -e --arg v "$LIBFX_VERSION" '.version == $v and ([.optionalDependencies[]] | length == 4 and all(. == $v))' sdk/dist/libfx/package.json >/dev/null
          jq -e --arg v "$LIBFX_VERSION" '.version == $v and .peerDependencies == { libfx: $v }' sdk/dist/libfx-term/package.json >/dev/null
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            jq -e --arg v "$LIBFX_VERSION" '.version == $v' "sdk/dist/libfx-$platform/package.json" >/dev/null
          done
          mkdir packages
          npm pack ./sdk/dist/libfx-linux-x64 ./sdk/dist/libfx-linux-arm64 ./sdk/dist/libfx-darwin-x64 ./sdk/dist/libfx-darwin-arm64 ./sdk/dist/libfx-term ./sdk/dist/libfx \
            --ignore-scripts --pack-destination packages --json > /tmp/libfx-pack.json
          (cd packages && sha256sum -- *.tgz > SHA256SUMS)

      - name: Validate package archives
        env:
          LIBFX_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          node -e '
            const version = process.env.LIBFX_VERSION;
            const reports = require("/tmp/libfx-pack.json");
            const platforms = ["linux-x64", "linux-arm64", "darwin-x64", "darwin-arm64"];
            const expected = new Map([
              ["libfx", [
                "package.json", "README.md", "LICENSE", "browser.js", "node.js", "node.cjs", "fx-sdk.js", "wasm.js", "wasm-module.js",
                "core-output.js", "tool-observation.js", "fetch-cleanup.js", "mcp.js", "skills.js", "skills-node.js", "subscription.js", "oauth.js", "chatgpt.js", "chatgpt-sign-in.js", "grok.js", "grok-sign-in.js", "custom-provider.js",
                "durable.js", "fx-harness.js", "durable/local.mjs", "durable/vercel.mjs", "durable/world.mjs",
                "types/browser.d.ts", "types/chatgpt.d.ts", "types/durable-local.d.ts", "types/durable-vercel.d.ts", "types/durable-world.d.ts", "types/grok.d.ts", "types/libfx.d.cts", "types/mcp.d.ts", "types/node.d.cts", "types/node.d.ts", "types/skills-node.d.ts", "types/skills.d.ts", "types/wasm.d.ts",
                "fx-core.wasm",
              ]],
              ...platforms.map((platform) => [`@libfx/${platform}`, ["package.json", "README.md", "LICENSE", "index.js", `libfx.${platform}.node`]]),
              ["@libfx/term", ["package.json", "README.md", "LICENSE", "node.js", "browser.js", "node.d.ts", "browser.d.ts", "fx-term.wasm"]],
            ]);
            const names = reports.map((report) => report.name);
            if (names.length !== expected.size || new Set(names).size !== expected.size || !names.every((name) => expected.has(name))) {
              throw new Error(`expected ${expected.size} packages, ${[...expected.keys()].join(", ")}; got ${names.join(", ")}`);
            }
            for (const report of reports) {
              if (report.version !== version) throw new Error(`${report.name} is ${report.version}, not ${version}`);
              const files = new Set(report.files.map(({ path }) => path));
              let docs = 0;
              if (report.name === "libfx") {
                // PKG-2, PKG-3: the addons and the terminal ship in packages of their own.
                if ([...files].some((name) => name.endsWith(".node") || name === "fx-term.wasm")) throw new Error("libfx must not carry a native addon or fx-term.wasm");
                // The libfx docs pages, taken from fx.sh when the package is built.
                if (!files.has("docs/README.md") || !files.has("docs/api.md")) throw new Error("libfx is missing the libfx docs");
                docs = [...files].filter((name) => /^docs\/[A-Za-z0-9/-]+\.md$/.test(name)).length;
              }
              const required = expected.get(report.name);
              for (const name of required) {
                if (!files.has(name)) throw new Error(`${report.name} is missing ${name}`);
              }
              if (files.size !== required.length + docs) throw new Error(`${report.name}: unexpected file count: ${files.size}`);
              console.log(`validated ${report.name}@${report.version}: ${report.files.length} files, ${report.size} bytes packed, ${report.unpackedSize} unpacked`);
            }
          '

      # Pull request CI runs the full package qualification (Next, resilience,
      # every module format). Publishing only proves these exact archives
      # install and run on each backend: libfx with the linux-x64 addon, and
      # @libfx/term.
      - name: Smoke test the installed packages
        env:
          LIBFX_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          node sdk/tests/test-packed-example.mjs "packages/libfx-${LIBFX_VERSION}.tgz" native esm
          node --experimental-wasm-jspi sdk/tests/test-packed-example.mjs "packages/libfx-${LIBFX_VERSION}.tgz" wasm esm

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libfx-packages
          path: packages/
          if-no-files-found: error

  publish:
    needs: [metadata, package]
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: libfx-packages
          path: packages
      - run: cd packages && sha256sum --check SHA256SUMS

      - name: Confirm dev publish still targets main
        if: needs.metadata.outputs.channel == 'dev'
        env:
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
        run: |
          MAIN_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$MAIN_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::main advanced to ${MAIN_SHA}; refusing to move the dev channel to stale ${RELEASE_SHA}"
            exit 1
          fi

      # Trusted publishing can't create a package, so a missing one stops the
      # release here, before any package of this version is published.
      - name: Confirm every package exists on npm
        run: |
          set -euo pipefail
          missing=()
          for name in @libfx/linux-x64 @libfx/linux-arm64 @libfx/darwin-x64 @libfx/darwin-arm64 @libfx/term libfx; do
            if ! output=$(npm view "$name" name --registry=https://registry.npmjs.org/ 2>&1); then
              if grep -q E404 <<<"$output"; then
                missing+=("$name")
              else
                echo "$output" >&2
                echo "::error::could not look up ${name} on npm"
                exit 1
              fi
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Not on npm yet: ${missing[*]}. Trusted publishing cannot create a package: create each one on npmjs.com and add this workflow as its trusted publisher (repository vercel-labs/fx, workflow publish-libfx.yml, environment npm), then run this workflow again."
            exit 1
          fi

      # The packages libfx depends on go first, so libfx never appears on the
      # registry before them. A version already published is left as it is,
      # so a rerun after a partial publish finishes the rest.
      - name: Publish the verified archives with npm trusted publishing
        env:
          LIBFX_VERSION: ${{ needs.metadata.outputs.version }}
          NPM_TAG: ${{ needs.metadata.outputs.npm_tag }}
        run: |
          set -euo pipefail
          publish() {
            if npm view "$1@${LIBFX_VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
              echo "$1@${LIBFX_VERSION} is already published; leaving ${NPM_TAG} unchanged"
              return
            fi
            npm publish "$2" --ignore-scripts --access public --tag "$NPM_TAG" --provenance
          }
          # `./`: npm reads `packages/<file>.tgz` as a GitHub repository.
          for package in linux-x64 linux-arm64 darwin-x64 darwin-arm64 term; do
            publish "@libfx/${package}" "./packages/libfx-${package}-${LIBFX_VERSION}.tgz"
          done
          publish libfx "./packages/libfx-${LIBFX_VERSION}.tgz"

  verify-published:
    needs: [metadata, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: libfx-packages
          path: packages
      # A byte-identical registry archive is the package that already passed
      # the smoke test above, so comparing bytes is the whole verification.
      - name: Download and compare the immutable registry versions
        env:
          LIBFX_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          cd packages
          sha256sum --check SHA256SUMS
          mkdir registry
          for name in @libfx/linux-x64 @libfx/linux-arm64 @libfx/darwin-x64 @libfx/darwin-arm64 @libfx/term libfx; do
            file=$(npm pack "${name}@${LIBFX_VERSION}" --ignore-scripts --registry=https://registry.npmjs.org/ --pack-destination registry --json | jq -r '.[0].filename')
            cmp "$(basename "$file")" "registry/$(basename "$file")"
            echo "${name}@${LIBFX_VERSION} on npm is the archive this workflow tested"
          done
